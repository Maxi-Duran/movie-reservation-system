 #max
name: main

on:
  push: 
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: checkout del codigo
      uses: actions/checkout@v6
    - name: setup nodejs
      uses: actions/setup-node@v6
      with:
          node-version: '20' 
          cache: 'npm'
    - name: instalar dependencias
      run: npm install
      
    - name: ejecutar tests
      run: npm run test
      
    - name: Set up Docker Build
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker build -t mi-app-cine:${{ github.sha }} .
        echo "¡Imagen construida con éxito para el commit ${{ github.sha }}!"
        
    - name: Configurar credenciales aws
      uses: aws-actions/configure-aws-credentials@v5.1.1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
        
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: build to amazron ecr 
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: github-actions-test  
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        echo "Imagen subida a ECR: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          
    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
            host: 18.228.225.152
            username: ec2-user
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
                aws ecr get-login-password --region sa-east-1 | sudo docker login --username AWS --password-stdin 561903439208.dkr.ecr.sa-east-1.amazonaws.com
                cd /home/ec2-user
                sudo docker-compose pull
                sudo docker-compose down || true
                sudo docker-compose up -d
      
