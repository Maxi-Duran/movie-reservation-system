name: main

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout del codigo
        uses: actions/checkout@v6
      - name: setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: instalar dependencias
        run: npm install

      - name: ejecutar tests
        run: npm run test
      
     - name: Set up Docker Build
       uses: docker/setup-buildx-action@v6

      - name: Build Docker Image
        run: |
          docker build -t mi-app-cine:${{ github.sha }} .
          echo "¡Imagen construida con éxito para el commit ${{ github.sha }}!"
